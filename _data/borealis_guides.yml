# Guide PDFs that live in Borealis and are copied into this site.
#
# Borealis is the source of truth: to update a guide, publish a new version
# of its dataset in Borealis. The "Sync guide PDFs from Borealis" GitHub
# Action then downloads the latest published PDF to `path` (daily, or on
# demand from the Actions tab) and the page embed picks it up.
#
# Fields per guide:
#   id    - short name used in the page: {% include borealis-pdf.html id="readme" %}
#   doi   - the dataset's persistent ID in Borealis (stays the same across versions)
#   path  - where the PDF is saved in this repo (keep it fixed; the embed uses it)
#   match - optional filename pattern if the dataset ever holds more than one file
#           (default "*.pdf"; exactly one public file must match)

server: https://borealisdata.ca

guides:
  - id: file-naming
    doi: doi:10.5683/SP4/SP73CF
    path: content/guides/01_file-naming_one-pager.pdf
  - id: file-formats
    doi: doi:10.5683/SP4/TQN4SZ
    path: content/guides/02_file-formats_one-pager.pdf
  - id: readme
    doi: doi:10.5683/SP4/VCP9BO
    path: content/guides/03_readme_one-pager.pdf
  - id: directory-structures
    doi: doi:10.5683/SP4/ARNQNC
    path: content/guides/04_directory-structures_one-pager.pdf
  - id: basic-deposit
    doi: doi:10.5683/SP4/PTWBEX
    path: content/guides/05-1_basic-deposit_one-pager.pdf
  - id: advanced-deposit
    doi: doi:10.5683/SP4/DX8VQ3
    path: content/guides/05-2_advanced-deposit_one-pager.pdf
  - id: admin-access
    doi: doi:10.5683/SP4/DQSLEF
    path: content/guides/05-3_admin-access_one-pager.pdf
  - id: role-allocation
    doi: doi:10.5683/SP4/PSNEHZ
    path: content/guides/05-3_role-allocation_one-pager.pdf
  - id: data-dictionary
    doi: doi:10.5683/SP4/PUCDI0
    path: content/guides/07_data-dictionary_one-pager.pdf
  - id: license
    doi: doi:10.5683/SP4/0MNWFS
    path: content/guides/09_license_one-pager.pdf
